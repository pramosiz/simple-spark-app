name=SparkLog4jConfig
# Nivel por defecto y appenders
rootLogger.level=INFO
rootLogger.appenderRefs=console, file, errorFile
rootLogger.appenderRef.console.ref=ConsoleAppender
rootLogger.appenderRef.file.ref=FileAppender
rootLogger.appenderRef.errorFile.ref=ErrorAppender
# Console appender
appender.ConsoleAppender.type=Console
appender.ConsoleAppender.name=ConsoleAppender
appender.ConsoleAppender.target=SYSTEM_OUT
appender.ConsoleAppender.layout.type=PatternLayout
appender.ConsoleAppender.layout.pattern=%d{yyyy/MM/dd HH:mm:ss} %-5p [%t] %c: %m%n
# File appender
appender.FileAppender.type=RollingFile
appender.FileAppender.name=FileAppender
appender.FileAppender.fileName=/opt/bitnami/spark/logs/spark.log
appender.FileAppender.filePattern=/opt/bitnami/spark/logs/spark-%d{yyyy-MM-dd}-%i.log.gz
appender.FileAppender.layout.type=PatternLayout
appender.FileAppender.layout.pattern=%d{yyyy/MM/dd HH:mm:ss} %-5p [%t] %c: %m%n
# Policies for rolling file appender
appender.FileAppender.policies.type=Policies
appender.FileAppender.policies.time.type=TimeBasedTriggeringPolicy
appender.FileAppender.policies.time.interval=1
appender.FileAppender.policies.time.modulate=true
appender.FileAppender.policies.size.type=SizeBasedTriggeringPolicy
appender.FileAppender.policies.size.size=10MB
appender.FileAppender.policies.startup.type=OnStartupTriggeringPolicy
appender.FileAppender.policies.startup.minSize=0
# Strategy for rolling file appender
appender.FileAppender.strategy.type=DefaultRolloverStrategy
appender.FileAppender.strategy.max=5
appender.FileAppender.strategy.compressionLevel=9
# Error appender
appender.ErrorAppender.type=RollingFile
appender.ErrorAppender.name=ErrorAppender
appender.ErrorAppender.fileName=/opt/bitnami/spark/logs/spark-error.log
appender.ErrorAppender.filePattern=/opt/bitnami/spark/logs/spark-error-%d{yyyy-MM-dd}-%i.log.gz
appender.ErrorAppender.layout.type=PatternLayout
appender.ErrorAppender.layout.pattern=%d{yyyy/MM/dd HH:mm:ss} %-5p [%t] %c: %m%n
appender.ErrorAppender.immediateFlush=true
# Filter ErrorAppender
appender.ErrorAppender.filter.level.type=ThresholdFilter
appender.ErrorAppender.filter.level.level=ERROR
appender.ErrorAppender.filter.level.onMatch=ACCEPT
appender.ErrorAppender.filter.level.onMismatch=DENY
# Policies for rolling file appender (similares al FileAppender general)
appender.ErrorAppender.policies.type=Policies
appender.ErrorAppender.policies.time.type=TimeBasedTriggeringPolicy
appender.ErrorAppender.policies.time.interval=1
appender.ErrorAppender.policies.time.modulate=true
appender.ErrorAppender.policies.size.type=SizeBasedTriggeringPolicy
appender.ErrorAppender.policies.size.size=10MB
appender.ErrorAppender.policies.startup.type=OnStartupTriggeringPolicy
appender.ErrorAppender.policies.startup.minSize=0
# Strategy for rolling file appender (similares al FileAppender general)
appender.ErrorAppender.strategy.type=DefaultRolloverStrategy
appender.ErrorAppender.strategy.max=5
appender.ErrorAppender.strategy.compressionLevel=9
# Reduce verbosity
logger.spark.name=org.apache.spark
logger.spark.level=info
logger.hadoop.name=org.apache.hadoop
logger.hadoop.level=error